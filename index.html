or SHOOT-SHOOT (two per missile, better odds, drains magazines). Auto-engages after 15 s. AUTO-AD in the top bar skips these prompts.","NAVAL ARCADE (45 s): tap red-ringed incoming missiles to fire interceptors; tap an enemy ship to launch anti-ship missiles when its green light is on. Subs torpedo automatically. As attacker you must sink every enemy ship to take the zone, or you fall back.","LAND/AIR BATTLES: FIRE ROUND resolves one round of dice (d10 vs attack/defense). RETREAT pulls your attackers back. AUTO then SKIP plays it out.","Amphibious assaults need control of the adjacent sea zone. Landing units fight at \u22121 attack (\u22122 vs a homeland); amphibious brigades skip the base \u22121. Land units defending a capital get +1."]],["Home front",["TPFDD: airlift/sealift capacity and port damage set each purchase's ETA. Queues longer than capacity add delay; damaged hubs, San Diego/Norfolk, or a Red-held Taiwan Strait slow deliveries.","COST OF WAR: spending, new debt, KIA and equipment lost. Casualties, debt, lost territory, lost carriers, struck bases and occupied homeland all erode Support.","RESOURCES: contested chokepoints spike prices: Taiwan Strait \u2192 chips, Malacca/Hormuz \u2192 oil, Panama \u2192 food. Price spikes cut production.","UNREST (Blue) / DISSENT (Red): triggered when will runs low. Each level cuts production 6% (max 30%). Respond with an address, the Guard, the Insurrection Act, or ignore it.","AUTHORITIES: one-time powers (DPA, NEA, AUMF, Reserve call-up, Draft, CRAF, SPR, Insurrection Act; Red has Fusion, Mobilization, Propaganda, Rare-Earth Ban, Energy Lifeline, Martial Law). Each lists its benefit and its cost.","ROGUE COMMANDER: from turn 4 an officer may strike without orders. Relieve, court-martial, or back them publicly."]],["Giant Voice & audio",['When a named base (JBPHH, Andersen, Kadena, Osan, Yokosuka, Misawa, San Diego, Norfolk, JBER, Peterson) is attacked: siren + "Real world, real world. Incoming missile\u2026" then "All clear".',"Top bar: \u{1F50A} SFX mutes effects and voice. \u266A MUSIC toggles the adaptive score (remembered). GV toggles announcements. Slider = master volume.","The music is sparse and ambient in quiet moments and rises during combat, incoming raids and DEFCON 1\u20132."]],["Starting: war or ELITE CONSTELLATION",["START AT WAR skips the exercise: the shooting starts on day 1 (after the President's war address and your OPORD).","ELITE CONSTELLATION is a JCS-directed global exercise first. Named Blue and Red exercises run at once. Weapons hold: you can buy, move and pre-position, but not attack or strike.","Each exercise day brings an incident (collision at sea, stray missile, unsafe intercept, cyber intrusion, misread exercise) with 3 choices: De-escalate (tension \u221210, the other side +$3), Shadow & track (tension +3, one enemy ship starts the war damaged), Show of force (tension +9, support +1.5, +1 unit in theater when war comes), Raise FPCON (tension +2, $2, bases take 12% less damage per level for the first war turns).","When the TENSION meter hits 100, or the other side decides to strike (more likely at high tension, higher difficulty, and certain by day 8): EXERCISE TERMINATED \u2014 REAL WORLD."]],["Readiness briefs (\u{1F4CB})",["At the start of each turn the combatant commanders report: INDOPACOM, NORTHCOM/NORAD, SOUTHCOM, EUCOM, CENTCOM, STRATCOM, CYBERCOM, SPACECOM, TRANSCOM, SOCOM (Red: PLA Eastern/Southern/Northern Theaters, Russian districts, KPA).","Each card shows a C1\u2013C4 rating (C1 best) computed from losses, magazines, TPFDD, resources, damage and threats in its area, plus shortfalls and one request.","Approve spends the listed cost for a real effect (e.g. interceptor resupply, a Patriot battery, sealift). Deny gives back $1 but that command's rating slips next turn. Dismiss closes it; reopen with \u{1F4CB}."]],["OPS tab: production, command, homeland, diplomacy",["WAR PRODUCTION: Peacetime / Partial / Full War Footing / Total War. Higher levels raise output toward +15/+35/+60% but ramp up slowly (US +6%/turn; China/Russia +10%/turn) and cost debt, support and unrest risk each turn. Blackouts and a NATO embargo cut output.","CONTINUITY OF COMMAND: the E-4B Nightwatch (NAOC) and E-6B Mercury (Looking Glass) launch automatically at DEFCON 2, or tap Scramble. While airborne, losing Washington or Offutt doesn't disrupt production and a fallen capital gives a 2-turn grace to retake it. Endurance 6 turns with tankers (3 without); small shoot-down risk. You can also hunt the enemy's Il-80 (30% success, risky).","SLEEPER CELLS: once the US commits to Taiwan, China/Russia state-directed operatives can be activated (Red pays $6; the AI uses them on Commander+). They cause blackouts (\u2212production), sabotage (TPFDD delays), cyberattacks ($) and drone hits on bases. Counters: FBI/DHS sweep, National Guard protection, grid hardening, CYBERCOM.","DIPLOMACY: Canada and Mexico drift toward hostility under Red influence. At 60 they turn hostile: Red basing, border incursions, smuggling that strengthens cells, and new northern/southern fronts. NATO escalates at 25/50/75: sanctions \u2192 basing & overflight denied \u2192 ports closed & embargo. One diplomatic action per turn can push these back."]],["Speeches & breaking news",["The President (or Red's Chairman on state TV) speaks when war begins or the exercise goes real, at DEFCON 2/1, after the first homeland strike, major blackouts, emergency powers (DPA, draft, Insurrection Act, national emergency), carriers sunk, a neighbor turning hostile, the airborne command post launching, and when the war ends. Primetime addresses come from the Oval Office; statements from the briefing-room podium.","Non-critical speeches have a 2-turn cooldown. Replay any speech from OPS \u2192 Speeches Archive or the LOG. Enemy broadcasts are archived too.","LGN Breaking News covers major events full-screen with a map inset and an anchor voice. Tap Skip any time."]],["Sound",["\u{1F39A} opens the mixer: Master, Music, SFX and Voice sliders, saved on this device. Sounds pan left/right by where they happen on the map. \u266A toggles music; \u{1F50A} mutes SFX and voice; GV toggles Giant Voice."]],["Difficulty",["RECRUIT: \u221220% AI income, cautious, noisy decisions, no feints.","VETERAN: normal income, threat maps, occasional feints.","COMMANDER: +15% AI income, sharper odds math, multi-front pushes, counter-purchasing.","SUPERINTELLIGENCE: +35% AI income, deepest simulations, no decision noise, frequent feints, fully adapts to your habits, more willing to use strategic weapons at DEFCON 1\u20132."]]],lh=[["Is this real? Who made it?","A work of fiction. Not affiliated with or endorsed by the U.S. Government or any government. The presidents shown are fictional. The Seal of the President and the Department of War seal are public-domain U.S. government works shown here in a fictional context; national flags come from the MIT-licensed flag-icons project."],["Why does it say Department of War?",'In 2025 the Department of Defense adopted "Department of War" as a secondary title, so the game uses Department of War and Secretary of War. Its seal appears on the Blue readiness brief and on news reports about the Department.'],["What is ELITE CONSTELLATION?","An optional pre-war phase: a JCS-directed global exercise. Pick one of 3 responses to each daily incident and watch the tension meter. At 100, or when the other side strikes, it becomes real war. Your choices carry over (FPCON protection, extra units in theater, pre-targeted enemy ships). Choose START AT WAR to skip it."],["What do C1\u2013C4 ratings mean?","Readiness ratings, like the real C-levels: C1 fully ready, C2 substantially ready, C3 marginally ready, C4 not ready. They're computed from the game state in each command's area. Approving a request costs money and has an immediate effect; denying saves $1 but lowers that command's rating next turn."],["How does war production work?","OPS \u2192 War Production. Moving up a level raises the output target, but factories and shipyards ramp up a few percent per turn, so plan ahead. Each level above Peacetime costs debt, support and some unrest risk every turn. China and Russia ramp faster. Blackouts and a NATO embargo reduce output. The DPA authority stacks on top."],["What happens if Washington falls?","If the E-4B/E-6B are airborne, the President governs from the air: you get 2 turns to retake the capital before the war is lost, and production isn't disrupted by command losses. If they're on the ground, losing the capital ends the game as before."],["What are sleeper cells, and why?","An abstract model of state-directed sabotage by enemy governments' operatives (never framed around any ethnic or immigrant community). They hit grids, pipelines, ports, rail, networks and bases. Counter with FBI/DHS sweeps, Guard protection, grid hardening and CYBERCOM, or ask SOUTHCOM/SOCOM/CYBERCOM for help in the readiness brief."],["Can Canada or Mexico really turn on the US?","In this scenario, yes, if Red influence pushes their hostility to 60. Their territory then hosts Red forces and a new front opens on the US border. Envoys and deals (OPS \u2192 Diplomacy, one per turn) push hostility back down. Below 35, a country with no Red troops on its soil restores ties."],["Can I turn off the speeches or news?","Every speech and broadcast has a Skip button. The \u{1F39A} mixer sets Voice volume (0 silences them). The readiness brief can be set not to open every turn (checkbox at the bottom)."],["How do I win?","Capture the enemy capital (Beijing region for Blue; Eastern US for Red), or reduce enemy will (Support / Party Control) to 0. If neither happens by the end of turn 30, the side with more VP plus will/10 wins on points."],["Why can't my units reach there?","Each unit has a movement value (M). Land units stop when they enter an enemy or contested territory. Crossing water to attack needs control of the adjacent sea zone (an amphibious assault). Non-combat sealift between your own coastal territories works up to 4 sea zones away, only if no enemy surface ships block the path. Aircraft can rebase or sortie within their M (+1 with a KC-46 tanker in the stack). Dormant units (NK/Russia before the northern front) and units that already acted cannot move."],["What do A / D / M mean?","Attack, Defense and Move. In battle each unit rolls a d10 and scores a hit if the roll is \u2264 its A (when attacking) or D (when defending). Modifiers: +1 D for land units defending a capital; \u22121 A for non-amphibious units landing from the sea, and an extra \u22121 when landing on an enemy homeland."],["How do interceptors and magazines work?","Air-defense units (DDG, CSG, Patriot, THAAD; HQ-9/S-400 for Red) can each engage a limited number of missiles per turn. Every shot also spends a round from your national magazine (SM-6, PAC-3, THAAD, GBI). Each interceptor has a kill chance by threat type: e.g. SM-6 \u224870% vs cruise, only \u224832% vs hypersonic; THAAD is best vs ballistic. Bases add a little point defense. Buy reloads on the Buy tab; empty magazines mean no shots."],["When do North Korea and Russia enter?","They are dormant at the start. The northern front opens at turn 5, or earlier if anyone attacks or strikes NK/Russian territory or forces, or South Korea is captured. A Red player can open it anytime with the OPEN NORTH FRONT button, and the Red AI may open it early (from turn 3) as a feint. Forces woken mid-turn by fighting need a turn to mobilize."],["Why isn't NATO helping?","It's part of the scenario. Europe won't fight for Taiwan, and Red pressure can turn it against Washington (sanctions, denied basing/overflight, closed ports). There are no European units or bases. Blue fights with the US, Japan, South Korea, Taiwan, the Philippines, Australia and Canada."],["What is TPFDD?","Time-Phased Force Deployment Data: the military's schedule for moving forces to a theater. Here, CONUS hubs deliver instantly; overseas hubs take 1\u20132 turns. Air-deployable units (aircraft, Patriot, THAAD, HIMARS, MLR) arrive a turn sooner. Queues beyond airlift/sealift capacity add delay, as do a damaged hub, damaged San Diego/Norfolk ports (sealift), or a Red-held Taiwan Strait (Taiwan deliveries). CRAF adds capacity."],["What does DEFCON do?","DEFCON tracks global tension (5 = calm, 1 = war footing). Strikes, captures, the northern front and some choices raise it; it also creeps up every round. At DEFCON 2 or 1, strategic weapons such as North Korea's ICBMs can be used, oil and food prices climb, and the music gets tense. Relieving or court-martialing a rogue commander lowers tension."],["What are presidential authorities and their costs?","One-time powers on the Home Front tab. DPA: +20% production for 4 turns, \u22122 support and +$40B debt. NEA: +$14 now, \u22121 support and +$25B debt. AUMF: +6 support, +5 tension. Reserve call-up: 3 BCT + 1 Patriot now, \u22123 support and \u221210% production for 3 turns. Draft: +2 BCT per turn for 5 turns, \u221210 support and unrest risk. CRAF: +3 airlift / +2 sealift, \u221210% production for 4 turns. SPR release: oil \u221235 for 4 turns. Insurrection Act (only during unrest): ends unrest, \u22126 support. Red has its own set."],["What is the rogue commander event?","From turn 4 there's a small chance each round that one of your officers strikes an enemy base without orders (30 damage, +8 tension). Relieve them (tension \u22126, support \u22121), court-martial (tension \u221210, support \u22123), or back them publicly (support +4, tension +12, and the enemy launches a wider retaliation strike wave on its next turn). The AI side faces the same event; if it backs its rogue officer, your side gets +3 support from public outrage."],["What makes public support drop?","Casualties and debt each round, units and carriers lost, bases and homeland struck, territory lost, and occupied home soil. Invoking some authorities also costs support. At low support, unrest can break out and cut production."],["How do I turn off the music or the voice?","\u266A MUSIC in the top bar toggles music on/off; the choice is remembered. \u{1F50A} SFX mutes sound effects and voice only. GV turns Giant Voice announcements off. \u{1F39A} opens separate Master, Music, SFX and Voice sliders (saved)."],["Does it save progress?","No. A game lasts only as long as the browser tab; reloading starts over. Your audio settings (music on/off, volume sliders, mute, Giant Voice), the readiness-brief preference and whether you've dismissed the first-turn tips are saved in the browser."],["What does SUPERINTELLIGENCE do differently?","The AI gets +35% income, runs the most battle simulations with no decision noise, attacks at lower odds thresholds, feints most often, fully adapts purchases and defenses to your habits (where you strike, what you buy), picks strike targets optimally, and is the most willing to use strategic weapons at DEFCON 1\u20132."],["Why did a strike barely do anything?",'Enemy air defense probably intercepted most of it. Check the "Known enemy air defense" line in the strike panel. Combine launchers into one big salvo, use hypersonic or stealth weapons, or first strike the ships and SAM sites protecting the target.']];function Ts({tab:e="guide",onClose:t}){let[n,r]=(0,Eu.useState)(e);return(0,x1.jsx)("div",{className:"helpbg",onClick:t,children:(0,x1.jsxs)("div",{className:"helpbox",onClick:a=>a.stopPropagation(),"data-testid":"help-modal",children:[(0,x1.jsxs)("div",{className:"helphead",children:[(0,x1.jsxs)("div",{className:"tabs",style:{flex:1,border:"none"},children:[(0,x1.jsx)("button",{className:n==="guide"?"on":"",onClick:()=>r("guide"),"data-testid":"help-tab-guide",children:"HOW TO PLAY"}),(0,x1.jsx)("button",{className:n==="faq"?"on":"",onClick:()=>r("faq"),"data-testid":"help-tab-faq",children:"FAQ"})]}),(0,x1.jsx)("button",{className:"btn sm",onClick:t,"data-testid":"help-close",children:"\u27 .ab-l3-row{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#0b1f4a,#123a7a 55%,#0b1f4aee);padding:8px 14px;border-top:3px solid #e1062c;box-shadow:0 6px 24px #0008}
.ab.red .ab-l3-row{background:linear-gradient(90deg,#6e0a0f,#b3121a 55%,#6e0a0fee);border-top-color:#ffd21f}
.ab-seal{width:46px;height:46px;flex:none;filter:drop-shadow(0 1px 3px #0009)}
.ab-l3-main{flex:1;min-width:0}
.ab-kick{font-size:11px;letter-spacing:.2em;color:#b9cff0;font-weight:700;display:flex;align-items:center}

.ab-title{font-size:clamp(16px,2.6vw,30px);font-weight:800;color:#fff;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-net{font-weight:900;font-size:26px;color:#fff;background:#e1062c;padding:2px 10px;border-radius:2px;letter-spacing:.02em}
.ab.red .ab-net{background:#ffd21f;color:#7a0a0f}
.ab-sub{background:#f2f5f9;color:#0b1b33;font-size:clamp(10px,1.3vw,13px);font-weight:700;letter-spacing:.08em;padding:4px 14px}
.ab-tick{display:flex;align-items:stretch;background:#0a0f18;color:#e8eef6;font-size:13px;font-weight:600}
.ab-tag{background:#e1062c;color:#fff;font-weight:900;padding:4px 10px;flex:none}
.ab.red .ab-tag{background:#ffd21f;color:#7a0a0f}
.ab-tick-win{overflow:hidden;white-space:nowrap;flex:1;padding:4px 0}
.ab-roll{display:inline-block;animation:roll 38s linear infinite;padding-left:100%}
.ab-cstv{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 40%,#c0141b,#5b0508 70%,#200203);overflow:hidden}
.ab-rays{position:absolute;left:50%;top:40%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(#ffd21f10 0 6deg,#0000 6deg 15deg);animation:radar 90s linear infinite}

.ab-ck{font-size:11px;letter-spacing:.2em;color:#ffd21f}
.ab-ct{font-size:clamp(16px,2.2vw,26px);font-weight:900;margin:6px 0 12px;letter-spacing:.03em}
.ab-cq{font-size:clamp(15px,2vw,22px);line-height:1.45;font-family:Georgia,serif;animation:fadeup .3s ease-out;min-height:3em}

:root{--bg:#05080d;--panel:#0b121bcc;--panel2:#0e1824;--edge:#1f3246;--edge2:#2d4a66;--txt:#dce8f5;--dim:#7d93a8;--amber:#ffb000;--blue:#4ca3ff;--red:#ff4d55;--green:#3dd68c;--mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body,#root{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--mono);cursor:pointer}
.btn{background:linear-gradient(#15263a,#0d1a29);color:var(--txt);border:1px solid var(--edge2);border-radius:6px;padding:7px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.btn:hover{border-color:var(--amber);color:#fff;box-shadow:0 0 12px #ffb00044}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.pri{background:linear-gradient(#b37700,#7a5000);border-color:#ffc440;color:#fff;font-weight:700}
.btn.red{background:linear-gradient(#8e1d23,#5c1216);border-color:#ff6a70}
.btn.blue{background:linear-gradient(#1b4f8e,#12335c);border-color:#5fb0ff}
.btn.sm{padding:4px 8px;font-size:11px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(#0c1520,#070c12);border-bottom:1px solid var(--edge);flex-wrap:wrap;z-index:5}
.top .grp{display:flex;align-items:center;gap:6px;font-size:12px}
.lbl{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.defcon{padding:3px 8px;border-radius:4px;font-weight:700;font-size:12px;letter-spacing:.1em;border:1px solid}
.bar{width:70px;height:7px;background:#1a2633;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar>i{display:block;height:100%}
.main{flex:1;display:flex;min-height:0;position:relative}
.mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%,#0b1f33 0%,#050a12 75%)}
.mapwrap svg{width:100%;height:100%;display:block}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px)}30%{transform:translate(6px,-5px)}45%{transform:translate(-5px,-3px)}60%{transform:translate(4px,5px)}80%{transform:translate(-2px,2px)}}
.side{width:370px;max-width:100%;display:flex;flex-direction:column;background:var(--panel2);border-left:1px solid var(--edge);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.tabs button{flex:1;background:none;border:none;color:var(--dim);padding:8px 4px;font-size:10.5px;letter-spacing:.08em;border-bottom:2px solid transparent}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.pane{flex:1;overflow:auto;padding:10px;font-size:12px;line-height:1.45}
.card{background:#0a131d;border:1px solid var(--edge);border-radius:8px;padding:9px;margin-bottom:9px}
.card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;color:var(--amber)}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.urow{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:5px;border:1px solid transparent}
.urow:hover{background:#12202f}
.urow.sel{border-color:var(--amber);background:#1c1a0c}
.urow .nm{flex:1;min-width:0}
.urow .nm small{display:block;color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;border:1px solid var(--edge2);color:var(--dim)}
.ticker{height:26px;background:#0a0f16;border-top:1px solid var(--edge);overflow:hidden;white-space:nowrap;font-size:12px;display:flex;align-items:center}
.ticker .tag{background:var(--red);color:#fff;font-weight:700;padding:0 10px;height:100%;display:flex;align-items:center;letter-spacing:.1em;flex:none}
.ticker .run{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.modalbg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal{background:linear-gradient(#0e1926,#08111a);border:1px solid var(--edge2);border-radius:12px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:0 0 40px #000,0 0 30px #4ca3ff22}
.modal h2{margin:0 0 8px;font-size:17px;letter-spacing:.1em}
.alertm{border-color:#ff4d55;box-shadow:0 0 50px #ff4d5566;animation:pulseb 1s infinite alternate}
@keyframes pulseb{from{box-shadow:0 0 20px #ff4d5544}to{box-shadow:0 0 60px #ff4d55aa}}
.flash{animation:fl .8s infinite alternate}@keyframes fl{from{opacity:1}to{opacity:.45}}
.menu{position:fixed;inset:0;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#10263d,#03060a 70%);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px}
.menu .box{max-width:980px;width:100%}
.title{font-size:34px;letter-spacing:.22em;font-weight:800;margin:4px 0;text-shadow:0 0 18px #ffb00088;color:#ffd27a}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.sidecard{border:2px solid var(--edge2);border-radius:12px;padding:16px;cursor:pointer;background:#0a131dcc;transition:all .2s;text-align:left;color:var(--txt)}
.sidecard:hover,.sidecard.on{transform:translateY(-2px)}
.sidecard.b.on{border-color:var(--blue);box-shadow:0 0 30px #4ca3ff55}
.sidecard.r.on{border-color:var(--red);box-shadow:0 0 30px #ff4d5555}
.diffs{display:flex;gap:8px;flex-wrap:wrap}
.diffs button{flex:1;min-width:140px}
.diffs button.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 14px #ffb00055}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0b1520ee;border:1px solid var(--amber);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:20;max-width:90%;text-align:center;box-shadow:0 0 20px #000}
@media(max-width:760px){.toast{top:auto;bottom:56px;font-size:12px}}
.views{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:4;max-width:70%}
.views button{background:#0b1520cc;border:1px solid var(--edge2);color:var(--dim);font-size:10px;padding:4px 7px;border-radius:5px}
.views button:hover{color:var(--amber)}
.legend{position:absolute;left:8px;bottom:8px;font-size:10px;color:var(--dim);background:#070d14cc;padding:5px 8px;border-radius:6px;border:1px solid var(--edge);z-index:4}
.aibanner{position:absolute;right:10px;top:10px;background:#2a0b0ecc;border:1px solid var(--red);color:#ffb3b6;padding:6px 12px;border-radius:6px;font-size:12px;z-index:6;letter-spacing:.1em}
.dice{display:inline-flex;width:20px;height:20px;border-radius:4px;align-items:center;justify-content:center;font-size:11px;margin:1px;font-weight:700}
input[type=range]{accent-color:var(--amber);width:70px}
table.t{width:100%;border-collapse:collapse;font-size:11px}table.t td,table.t th{padding:3px 4px;border-bottom:1px solid #16222f;text-align:left}table.t th{color:var(--dim);font-weight:400}
.choice{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 11px;text-transform:none;letter-spacing:0;font-size:12.5px}
.choice small{display:block;color:var(--dim);margin-top:2px}
@media (max-width:820px){
 .main{flex-direction:column}
 .side{width:100%;height:44%;border-left:none;border-top:1px solid var(--edge)}
 .title{font-size:22px}.choose{grid-template-columns:1fr}
 .top{gap:6px;padding:4px 6px}.top .hide-m{display:none}
}

.nb-ping{animation:nbping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}.nb-ping.d2{animation-delay:.9s}
@keyframes nbping{from{transform:scale(.4);opacity:1}to{transform:scale(3.2);opacity:0}}
.nb-wall-tag{position:absolute;left:10px;bottom:8px;font-size:11px;letter-spacing:.14em;color:#cfe3ff;background:#000a;padding:2px 8px}
.nb-brk{display:inline-block;background:#e1062c;color:#fff;font-weight:900;letter-spacing:.14em;font-size:clamp(14px,2vw,22px);padding:4px 12px;animation:livep 1.4s infinite}
.nb-hl{color:#fff;font-weight:900;font-size:clamp(20px,3.2vw,40px);line-height:1.1;margin-top:10px;text-shadow:0 2px 10px #000}
.nb-line{color:#cfe0f5;font-size:clamp(13px,1.6vw,18px);margin-top:14px;line-height:1.4;animation:fadeup .3s ease-out}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nb-desk{position:absolute;left:12%;right:12%;bottom:22%;height:12%;background:linear-gradient(180deg,#1a3b66,#0a1a30);border-top:3px solid #e1062c;border-radius:6px 6px 0 0;box-shadow:0 -10px 40px #0008;display:flex;align-items:center;justify-content:center;gap:14px}
.nb-desk-logo{font-weight:900;font-size:clamp(26px,4vw,48px);color:#fff;letter-spacing:.04em}
.nb-desk-sub{color:#9fc2ea;font-size:12px;letter-spacing:.24em}
.nb-bug{position:absolute;top:16px;right:20px;display:flex;align-items:center;gap:8px}
.nb-l3{position:absolute;left:3%;right:3%;bottom:14px;animation:l3in .5s ease-out}
.nb-l3-top{display:flex;align-items:center;gap:12px;background:#fff;color:#0b1b33;font-size:clamp(15px,2.2vw,26px);padding:6px 12px;border-left:8px solid #e1062c}
.nb-l3-brk{background:#e1062c;color:#fff;font-weight:900;font-size:.62em;letter-spacing:.14em;padding:3px 8px}
.nb-l3-sub{background:#0b1f4a;color:#dce8f7;font-size:12px;letter-spacing:.12em;padding:4px 12px}
.newsb.lowfx .nb-studio,.newsb.lowfx .nb-ping{animation:none!important}
.rwf{position:fixed;inset:0;z-index:97;display:flex;align-items:center;justify-content:center;background:#000c;cursor:pointer}
.rwf-flash{position:absolute;inset:0;background:#ff2d3a;animation:rwflash 1s steps(2) 5}
@keyframes rwflash{0%{opacity:.55}50%{opacity:0}}
.rwf-band{position:relative;text-align:center;width:100%;padding:26px 10px;background:repeating-linear-gradient(45deg,#ffcc00 0 22px,#111 22px 44px);box-shadow:0 0 80px #ff2d3a}
.rwf-band>*{position:relative}
.rwf-big,.rwf-big2{display:inline-block;background:#000;color:#fff;font-weight:900;font-size:clamp(28px,6vw,72px);letter-spacing:.1em;padding:4px 18px;margin:4px}
.rwf-big2{color:#ff2d3a;animation:dbglitch .25s steps(2) 8}
.rwf-sub{display:inline-block;background:#000d;color:#ffe08a;font-size:clamp(12px,1.6vw,17px);padding:6px 14px;margin-top:8px;max-width:90vw}
.rwf-tap{color:#fff;font-size:11px;letter-spacing:.3em;margin-top:8px;text-shadow:0 0 4px #000}

.rdm{max-width:1100px!important;width:96vw;max-height:92vh;overflow:auto}
.rd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:8px}
.rd-card{background:#0a131d;border:1px solid;border-left-width:5px;border-radius:8px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.rd-name{letter-spacing:.06em;font-size:12.5px}
.rd-chip{color:#000;font-weight:900;border-radius:4px;padding:1px 7px;font-size:13px}
.rd-aor{font-size:10.5px;color:#6f8599}
.rd-as{color:#dce7f2}
.rd-sh{color:#ffb070;font-size:11px}
.rd-req{margin-top:auto;border-top:1px dashed #22364a;padding-top:5px;font-size:11.5px}
.rd-req small{color:#8aa0b5}
.rd-btns{display:flex;gap:6px;margin-top:4px}
.rd-btns .btn{flex:1}
.rd-dec{font-weight:800;margin-top:4px;letter-spacing:.08em}.rd-dec.approved{color:#3dd68c}.rd-dec.denied{color:#ff8f8f}
.toast2{background:#123;border:1px solid #2b5d93;border-radius:6px;padding:5px 10px;margin-top:6px;font-size:12px}
.prod-lv{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.prod-lv .btn.on{background:#ffb000;color:#000;border-color:#ffb000;font-weight:800}
.exhud{position:absolute;left:10px;top:44px;z-index:12;width:min(420px,70vw);background:#05101cdd;border:1px solid #ffcf5a;border-radius:8px;padding:8px 10px;box-shadow:0 0 24px #ffcf5a33}
