 \u2014 spend funds on units at a deploy hub. Units arrive after their ETA (see TPFDD).","MOVE \u2014 select a territory or sea zone, press MOVE, tick units, confirm. Or tap a unit in the panel to light up where it can go.","COMBAT \u2014 press ATTACK on an enemy territory or sea zone, or STRIKE a named base/city with missiles and bombers.","END TURN \u2014 you collect income, then the AI takes its turn. You decide interceptor fire when it strikes you.","Each unit acts once per turn. Order does not matter: move, attack and strike in any sequence."]],["Map controls",["Pan: drag. Zoom: mouse wheel or pinch. Camera presets (GLOBAL, PACIFIC, TAIWAN, KOREA/JAPAN, ARCTIC, AMERICAS) sit top-left.","Click/tap a territory or sea zone to select it; the right panel (bottom on phones) shows forces, bases and actions.","Green highlight = legal move, red = attack. Hatched = occupied territory, dim icons = dormant or already used.","Esc clears the selection. INTEL shows the AI's assessed intent (it may be a feint). LOG records everything."]],["Combat",["STRIKES: select an enemy territory \u2192 Bases & Cities \u2192 STRIKE (or select a sea zone with enemy ships \u2192 STRIKE SHIPS). Tick launchers to build a salvo. Bigger salvos saturate air defense; hypersonics are hardest to stop.","INCOMING: when you are struck, choose HOLD FIRE, ONE PER MISSILE, or SHOOT-SHOOT (two per missile, better odds, drains magazines). Auto-engages after 15 s. AUTO-AD in the top bar skips these prompts.","NAVAL ARCADE (45 s): tap red-ringed incoming missiles to fire interceptors; tap an enemy ship to launch anti-ship missiles when its green light is on. Subs torpedo automatically. As attacker you must sink every enemy ship to take the zone, or you fall back.","LAND/AIR BATTLES: FIRE ROUND resolves one round of dice (d10 vs attack/defense). RETREAT pulls your attackers back. AUTO then SKIP plays it out.","Amphibious assaults need control of the adjacent sea zone. Landing units fight at \u22121 attack (\u22122 vs a homeland); amphibious brigades skip the base \u22121. Land units defending a capital get +1."]],["Home front",["TPFDD: airlift/sealift capacity and port damage set each purchase's ETA. Queues longer than capacity add delay; damaged hubs, San Diego/Norfolk, or a Red-held Taiwan Strait slow deliveries.","COST OF WAR: spending, new debt, KIA and equipment lost. Casualties, debt, lost territory, lost carriers, struck bases and occupied homeland all erode Support.","RESOURCES: contested chokepoints spike prices: Taiwan Strait \u2192 chips, Malacca/Hormuz \u2192 oil, Panama \u2192 food. Price spikes cut production.","UNREST (Blue) / DISSENT (Red): triggered when will runs low. Each level cuts production 6% (max 30%). Respond with an address, the Guard, the Insurrection Act, or ignore it.","AUTHORITIES: one-time powers (DPA, NEA, AUMF, Reserve call-up, Draft, CRAF, SPR, Insurrection Act; Red has Fusion, Mobilization, Propaganda, Rare-Earth Ban, Energy Lifeline, Martial Law). Each lists its benefit and its cost.","ROGUE COMMANDER: from turn 4 an officer may strike without orders. Relieve, court-martial, or back them publicly."]],["Giant Voice & audio",['When a named base (JBPHH, Andersen, Kadena, Osan, Yokosuka, Misawa, San Diego, Norfolk, JBER, Peterson) is attacked: siren + "Real world, real world. Incoming missile\u2026" then "All clear".',"Top bar: \u{1F50A} SFX mutes effects and voice. \u266A MUSIC toggles the adaptive score (remembered). GV toggles announcements. Slider = master volume.","The music is sparse and ambient in quiet moments and rises during combat, incoming raids and DEFCON 1\u20132."]],["Difficulty",["RECRUIT: \u221220% AI income, cautious, noisy decisions, no feints.","VETERAN: normal income, threat maps, occasional feints.","COMMANDER: +15% AI income, sharper odds math, multi-front pushes, counter-purchasing.","SUPERINTELLIGENCE: +35% AI income, deepest simulations, no decision noise, frequent feints, fully adapts to your habits, more willing to use strategic weapons at DEFCON 1\u20132."]]],F5=[["How do I win?","Capture the enemy capital (Beijing region for Blue; Eastern US for Red), or reduce enemy will (Support / Party Control) to 0. If neither happens by the end of turn 30, the side with more VP plus will/10 wins on points."],["Why can't my units reach there?","Each unit has a movement value (M). Land units stop when they enter an enemy or contested territory. Crossing water to attack needs control of the adjacent sea zone (an amphibious assault). Non-combat sealift between your own coastal territories works up to 4 sea zones away, only if no enemy surface ships block the path. Aircraft can rebase or sortie within their M (+1 with a KC-46 tanker in the stack). Dormant units (NK/Russia before the northern front) and units that already acted cannot move."],["What do A / D / M mean?","Attack, Defense and Move. In battle each unit rolls a d10 and scores a hit if the roll is \u2264 its A (when attacking) or D (when defending). Modifiers: +1 D for land units defending a capital; \u22121 A for non-amphibious units landing from the sea, and an extra \u22121 when landing on an enemy homeland."],["How do interceptors and magazines work?","Air-defense units (DDG, CSG, Patriot, THAAD; HQ-9/S-400 for Red) can each engage a limited number of missiles per turn. Every shot also spends a round from your national magazine (SM-6, PAC-3, THAAD, GBI). Each interceptor has a kill chance by threat type: e.g. SM-6 \u224870% vs cruise, only \u224832% vs hypersonic; THAAD is best vs ballistic. Bases add a little point defense. Buy reloads on the Buy tab; empty magazines mean no shots."],["When do North Korea and Russia enter?","They are dormant at the start. The northern front opens at turn 5, or earlier if anyone attacks or strikes NK/Russian territory or forces, or South Korea is captured. A Red player can open it anytime with the OPEN NORTH FRONT button, and the Red AI may open it early (from turn 3) as a feint. Forces woken mid-turn by fighting need a turn to mobilize."],["Why isn't NATO helping?","It's part of the scenario. Europe sits this war out, so there are no European units or bases. Blue fights with the US, Japan, South Korea, Taiwan, the Philippines, Australia and Canada."],["What is TPFDD?","Time-Phased Force Deployment Data: the military's schedule for moving forces to a theater. Here, CONUS hubs deliver instantly; overseas hubs take 1\u20132 turns. Air-deployable units (aircraft, Patriot, THAAD, HIMARS, MLR) arrive a turn sooner. Queues beyond airlift/sealift capacity add delay, as do a damaged hub, damaged San Diego/Norfolk ports (sealift), or a Red-held Taiwan Strait (Taiwan deliveries). CRAF adds capacity."],["What does DEFCON do?","DEFCON tracks global tension (5 = calm, 1 = war footing). Strikes, captures, the northern front and some choices raise it; it also creeps up every round. At DEFCON 2 or 1, strategic weapons such as North Korea's ICBMs can be used, oil and food prices climb, and the music gets tense. Relieving or court-martialing a rogue commander lowers tension."],["What are presidential authorities and their costs?","One-time powers on the Home Front tab. DPA: +20% production for 4 turns, \u22122 support and +$40B debt. NEA: +$14 now, \u22121 support and +$25B debt. AUMF: +6 support, +5 tension. Reserve call-up: 3 BCT + 1 Patriot now, \u22123 support and \u221210% production for 3 turns. Draft: +2 BCT per turn for 5 turns, \u221210 support and unrest risk. CRAF: +3 airlift / +2 sealift, \u221210% production for 4 turns. SPR release: oil \u221235 for 4 turns. Insurrection Act (only during unrest): ends unrest, \u22126 support. Red has its own set."],["What is the rogue commander event?","From turn 4 there's a small chance each round that one of your officers strikes an enemy base without orders (30 damage, +8 tension). Relieve them (tension \u22126, support \u22121), court-martial (tension \u221210, support \u22123), or back them publicly (support +4, tension +12, and the enemy launches a wider retaliation strike wave on its next turn). The AI side faces the same event; if it backs its rogue officer, your side gets +3 support from public outrage."],["What makes public support drop?","Casualties and debt each round, units and carriers lost, bases and homeland struck, territory lost, and occupied home soil. Invoking some authorities also costs support. At low support, unrest can break out and cut production."],["How do I turn off the music or the voice?","\u266A MUSIC in the top bar toggles music on/off; the choice is remembered. \u{1F50A} SFX mutes sound effects and voice only. GV turns Giant Voice announcements off. The slider sets the master volume."],["Does it save progress?","No. A game lasts only as long as the browser tab; reloading starts over. Your audio settings (music on/off, volume, mute, Giant Voice) and whether you've dismissed the first-turn tips are saved in the browser."],["What does SUPERINTELLIGENCE do differently?","The AI gets +35% income, runs the most battle simulations with no decision noise, attacks at lower odds thresholds, feints most often, fully adapts purchases and defenses to your habits (where you strike, what you buy), picks strike targets optimally, and is the most willing to use strategic weapons at DEFCON 1\u20132."],["Why did a strike barely do anything?",'Enemy air defense probably intercepted most of it. Check the "Known enemy air defense" line in the strike panel. Combine launchers into one big salvo, use hypersonic or stealth weapons, or first strike the ships and SAM sites protecting the target.']];function xs({tab:e="guide",onClose:t}){let[n,r]=(0,Xc.useState)(e);return(0,h1.jsx)("div",{className:"helpbg",onClick:t,children:(0,h1.jsxs)("div",{className:"helpbox",onClick:o=>o.stopPropagation(),"data-testid":"help-modal",children:[(0,h1.jsxs)("div",{className:"helphead",children:[(0,h1.jsxs)("div",{className:"tabs",style:{flex:1,border:"none"},children:[(0,h1.jsx)("button",{cla :root{--bg:#05080d;--panel:#0b121bcc;--panel2:#0e1824;--edge:#1f3246;--edge2:#2d4a66;--txt:#dce8f5;--dim:#7d93a8;--amber:#ffb000;--blue:#4ca3ff;--red:#ff4d55;--green:#3dd68c;--mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body,#root{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--mono);cursor:pointer}
.btn{background:linear-gradient(#15263a,#0d1a29);color:var(--txt);border:1px solid var(--edge2);border-radius:6px;padding:7px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.btn:hover{border-color:var(--amber);color:#fff;box-shadow:0 0 12px #ffb00044}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.pri{background:linear-gradient(#b37700,#7a5000);border-color:#ffc440;color:#fff;font-weight:700}
.btn.red{background:linear-gradient(#8e1d23,#5c1216);border-color:#ff6a70}
.btn.blue{background:linear-gradient(#1b4f8e,#12335c);border-color:#5fb0ff}
.btn.sm{padding:4px 8px;font-size:11px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(#0c1520,#070c12);border-bottom:1px solid var(--edge);flex-wrap:wrap;z-index:5}
.top .grp{display:flex;align-items:center;gap:6px;font-size:12px}
.lbl{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.defcon{padding:3px 8px;border-radius:4px;font-weight:700;font-size:12px;letter-spacing:.1em;border:1px solid}
.bar{width:70px;height:7px;background:#1a2633;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar>i{display:block;height:100%}
.main{flex:1;display:flex;min-height:0;position:relative}
.mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%,#0b1f33 0%,#050a12 75%)}
.mapwrap svg{width:100%;height:100%;display:block}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px)}30%{transform:translate(6px,-5px)}45%{transform:translate(-5px,-3px)}60%{transform:translate(4px,5px)}80%{transform:translate(-2px,2px)}}
.side{width:370px;max-width:100%;display:flex;flex-direction:column;background:var(--panel2);border-left:1px solid var(--edge);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.tabs button{flex:1;background:none;border:none;color:var(--dim);padding:8px 4px;font-size:10.5px;letter-spacing:.08em;border-bottom:2px solid transparent}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.pane{flex:1;overflow:auto;padding:10px;font-size:12px;line-height:1.45}
.card{background:#0a131d;border:1px solid var(--edge);border-radius:8px;padding:9px;margin-bottom:9px}
.card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;color:var(--amber)}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.urow{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:5px;border:1px solid transparent}
.urow:hover{background:#12202f}
.urow.sel{border-color:var(--amber);background:#1c1a0c}
.urow .nm{flex:1;min-width:0}
.urow .nm small{display:block;color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;border:1px solid var(--edge2);color:var(--dim)}
.ticker{height:26px;background:#0a0f16;border-top:1px solid var(--edge);overflow:hidden;white-space:nowrap;font-size:12px;display:flex;align-items:center}
.ticker .tag{background:var(--red);color:#fff;font-weight:700;padding:0 10px;height:100%;display:flex;align-items:center;letter-spacing:.1em;flex:none}
.ticker .run{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.modalbg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal{background:linear-gradient(#0e1926,#08111a);border:1px solid var(--edge2);border-radius:12px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:0 0 40px #000,0 0 30px #4ca3ff22}
.modal h2{margin:0 0 8px;font-size:17px;letter-spacing:.1em}
.alertm{border-color:#ff4d55;box-shadow:0 0 50px #ff4d5566;animation:pulseb 1s infinite alternate}
@keyframes pulseb{from{box-shadow:0 0 20px #ff4d5544}to{box-shadow:0 0 60px #ff4d55aa}}
.flash{animation:fl .8s infinite alternate}@keyframes fl{from{opacity:1}to{opacity:.45}}
.menu{position:fixed;inset:0;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#10263d,#03060a 70%);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px}
.menu .box{max-width:980px;width:100%}
.title{font-size:34px;letter-spacing:.22em;font-weight:800;margin:4px 0;text-shadow:0 0 18px #ffb00088;color:#ffd27a}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.sidecard{border:2px solid var(--edge2);border-radius:12px;padding:16px;cursor:pointer;background:#0a131dcc;transition:all .2s;text-align:left;color:var(--txt)}
.sidecard:hover,.sidecard.on{transform:translateY(-2px)}
.sidecard.b.on{border-color:var(--blue);box-shadow:0 0 30px #4ca3ff55}
.sidecard.r.on{border-color:var(--red);box-shadow:0 0 30px #ff4d5555}
.diffs{display:flex;gap:8px;flex-wrap:wrap}
.diffs button{flex:1;min-width:140px}
.diffs button.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 14px #ffb00055}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0b1520ee;border:1px solid var(--amber);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:20;max-width:90%;text-align:center;box-shadow:0 0 20px #000}
@media(max-width:760px){.toast{top:auto;bottom:56px;font-size:12px}}
.views{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:4;max-width:70%}
.views button{background:#0b1520cc;border:1px solid var(--edge2);color:var(--dim);font-size:10px;padding:4px 7px;border-radius:5px}
.views button:hover{color:var(--amber)}
.legend{position:absolute;left:8px;bottom:8px;font-size:10px;color:var(--dim);background:#070d14cc;padding:5px 8px;border-radius:6px;border:1px solid var(--edge);z-index:4}
.aibanner{position:absolute;right:10px;top:10px;background:#2a0b0ecc;border:1px solid var(--red);color:#ffb3b6;padding:6px 12px;border-radius:6px;font-size:12px;z-index:6;letter-spacing:.1em}
.dice{display:inline-flex;width:20px;height:20px;border-radius:4px;align-items:center;justify-content:center;font-size:11px;margin:1px;font-weight:700}
input[type=range]{accent-color:var(--amber);width:70px}
table.t{width:100%;border-collapse:collapse;font-size:11px}table.t td,table.t th{padding:3px 4px;border-bottom:1px solid #16222f;text-align:left}table.t th{color:var(--dim);font-weight:400}
.choice{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 11px;text-transform:none;letter-spacing:0;font-size:12.5px}
.choice small{display:block;color:var(--dim);margin-top:2px}
@media (max-width:820px){
 .main{flex-direction:column}
 .side{width:100%;height:44%;border-left:none;border-top:1px solid var(--edge)}
 .title{font-size:22px}.choose{grid-template-columns:1fr}
 .top{gap:6px;padding:4px 6px}.top .hide-m{display:none}
}
