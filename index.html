:root{--bg:#05080d;--panel:#0b121bcc;--panel2:#0e1824;--edge:#1f3246;--edge2:#2d4a66;--txt:#dce8f5;--dim:#7d93a8;--amber:#ffb000;--blue:#4ca3ff;--red:#ff4d55;--green:#3dd68c;--mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body,#root{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--mono);cursor:pointer}
.btn{background:linear-gradient(#15263a,#0d1a29);color:var(--txt);border:1px solid var(--edge2);border-radius:6px;padding:7px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;transition:all .15s}
.btn:hover{border-color:var(--amber);color:#fff;box-shadow:0 0 12px #ffb00044}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.pri{background:linear-gradient(#b37700,#7a5000);border-color:#ffc440;color:#fff;font-weight:700}
.btn.red{background:linear-gradient(#8e1d23,#5c1216);border-color:#ff6a70}
.btn.blue{background:linear-gradient(#1b4f8e,#12335c);border-color:#5fb0ff}
.btn.sm{padding:4px 8px;font-size:11px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(#0c1520,#070c12);border-bottom:1px solid var(--edge);flex-wrap:wrap;z-index:5}
.top .grp{display:flex;align-items:center;gap:6px;font-size:12px}
.lbl{color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.defcon{padding:3px 8px;border-radius:4px;font-weight:700;font-size:12px;letter-spacing:.1em;border:1px solid}
.bar{width:70px;height:7px;background:#1a2633;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar>i{display:block;height:100%}
.main{flex:1;display:flex;min-height:0;position:relative}
.mapwrap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 40%,#0b1f33 0%,#050a12 75%)}
.mapwrap svg{width:100%;height:100%;display:block}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-7px,4px)}30%{transform:translate(6px,-5px)}45%{transform:translate(-5px,-3px)}60%{transform:translate(4px,5px)}80%{transform:translate(-2px,2px)}}
.side{width:370px;max-width:100%;display:flex;flex-direction:column;background:var(--panel2);border-left:1px solid var(--edge);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.tabs button{flex:1;background:none;border:none;color:var(--dim);padding:8px 4px;font-size:10.5px;letter-spacing:.08em;border-bottom:2px solid transparent}
.tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
.pane{flex:1;overflow:auto;padding:10px;font-size:12px;line-height:1.45}
.card{background:#0a131d;border:1px solid var(--edge);border-radius:8px;padding:9px;margin-bottom:9px}
.card h3{margin:0 0 6px;font-size:12.5px;letter-spacing:.08em;color:var(--amber)}
.row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.urow{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:5px;border:1px solid transparent}
.urow:hover{background:#12202f}
.urow.sel{border-color:var(--amber);background:#1c1a0c}
.urow .nm{flex:1;min-width:0}
.urow .nm small{display:block;color:var(--dim);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;border:1px solid var(--edge2);color:var(--dim)}
.ticker{height:26px;background:#0a0f16;border-top:1px solid var(--edge);overflow:hidden;white-space:nowrap;font-size:12px;display:flex;align-items:center}
.ticker .tag{background:var(--red);color:#fff;font-weight:700;padding:0 10px;height:100%;display:flex;align-items:center;letter-spacing:.1em;flex:none}
.ticker .run{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.modalbg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:10px}
.modal{background:linear-gradient(#0e1926,#08111a);border:1px solid var(--edge2);border-radius:12px;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:16px;box-shadow:0 0 40px #000,0 0 30px #4ca3ff22}
.modal h2{margin:0 0 8px;font-size:17px;letter-spacing:.1em}
.alertm{border-color:#ff4d55;box-shadow:0 0 50px #ff4d5566;animation:pulseb 1s infinite alternate}
@keyframes pulseb{from{box-shadow:0 0 20px #ff4d5544}to{box-shadow:0 0 60px #ff4d55aa}}
.flash{animation:fl .8s infinite alternate}@keyframes fl{from{opacity:1}to{opacity:.45}}
.menu{position:fixed;inset:0;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#10263d,#03060a 70%);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px}
.menu .box{max-width:980px;width:100%}
.title{font-size:34px;letter-spacing:.22em;font-weight:800;margin:4px 0;text-shadow:0 0 18px #ffb00088;color:#ffd27a}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.sidecard{border:2px solid var(--edge2);border-radius:12px;padding:16px;cursor:pointer;background:#0a131dcc;transition:all .2s;text-align:left;color:var(--txt)}
.sidecard:hover,.sidecard.on{transform:translateY(-2px)}
.sidecard.b.on{border-color:var(--blue);box-shadow:0 0 30px #4ca3ff55}
.sidecard.r.on{border-color:var(--red);box-shadow:0 0 30px #ff4d5555}
.diffs{display:flex;gap:8px;flex-wrap:wrap}
.diffs button{flex:1;min-width:140px}
.diffs button.on{border-color:var(--amber);color:var(--amber);box-shadow:0 0 14px #ffb00055}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0b1520ee;border:1px solid var(--amber);padding:8px 14px;border-radius:8px;font-size:12.5px;z-index:20;max-width:90%;text-align:center;box-shadow:0 0 20px #000}
@media(max-width:760px){.toast{top:auto;bottom:56px;font-size:12px}}
.views{position:absolute;left:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:4;max-width:70%}
.views button{background:#0b1520cc;border:1px solid var(--edge2);color:var(--dim);font-size:10px;padding:4px 7px;border-radius:5px}
.views button:hover{color:var(--amber)}
.legend{position:absolute;left:8px;bottom:8px;font-size:10px;color:var(--dim);background:#070d14cc;padding:5px 8px;border-radius:6px;border:1px solid var(--edge);z-index:4}
.aibanner{position:absolute;right:10px;top:10px;background:#2a0b0ecc;border:1px solid var(--red);color:#ffb3b6;padding:6px 12px;border-radius:6px;font-size:12px;z-index:6;letter-spacing:.1em}
.dice{display:inline-flex;width:20px;height:20px;border-radius:4px;align-items:center;justify-content:center;font-size:11px;margin:1px;font-weight:700}

}
